name: Publish signed APK
on:
  push:
    paths:
      - .github/workflows/publish-signed-apk.yml
    branches:
      - main
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified 3.3.1 build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15179736655/zip" \
            -o release-artifact.zip
          mkdir extracted
          unzip -q release-artifact.zip -d extracted
          APK="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" medhar-lorai-3.3.1.apk
          file medhar-lorai-3.3.1.apk
          sha256sum medhar-lorai-3.3.1.apk
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create app-v3.3.1 medhar-lorai-3.3.1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "মেধার লড়াই 3.3.1" \
            --notes "Signed Android release APK for মেধার লড়াই (Battle of Brains), version 3.3.1. Package: com.medhar.lorai."
