workflows:
  android-debug:
    name: Medhar Lorai Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Check Gradle and build debug APK
        script: |
          gradle --version
          gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
